<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paxpanel</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="panel">
  <header class="hdr"><span id="clock">--:--</span><span class="upt">up <b id="uptime">–</b></span><span id="date"></span></header>

  <section class="twin">
    <div class="col" id="cpu">
      <div class="ttl"><span class="t">CPU</span><img class="logo" alt="" hidden></div>
      <div class="sub"></div>
      <div class="gauge">
        <svg viewBox="0 0 180 160">
          <path class="track" pathLength="100" d="M 33.4 146.6 A 80 80 0 1 1 146.6 146.6"/>
          <path class="fill" pathLength="100" d="M 33.4 146.6 A 80 80 0 1 1 146.6 146.6"/>
        </svg>
        <div class="v"><span class="temp">–</span><b>°</b></div>
        <div class="l">load <span class="load">–</span></div>
      </div>
      <div class="kv">
        <span>P-cores</span><span class="pclk">–</span>
        <span>E-cores</span><span class="eclk">–</span>
        <span>Volt</span><span class="volt">–</span>
        <span>Power</span><span class="power">–</span>
        <span>Hottest</span><span class="hottest">–</span>
      </div>
    </div>
    <div class="col" id="gpu">
      <div class="ttl"><span class="t">GPU</span><img class="logo" alt="" hidden></div>
      <div class="sub"></div>
      <div class="gauge">
        <svg viewBox="0 0 180 160">
          <path class="track" pathLength="100" d="M 33.4 146.6 A 80 80 0 1 1 146.6 146.6"/>
          <path class="fill" pathLength="100" d="M 33.4 146.6 A 80 80 0 1 1 146.6 146.6"/>
        </svg>
        <div class="v"><span class="temp">–</span><b>°</b></div>
        <div class="l">load <span class="load">–</span></div>
      </div>
      <div class="kv">
        <span>Clock</span><span class="clock">–</span>
        <span>Hot spot</span><span class="hot">–</span>
        <span>VRAM temp</span><span class="memj">–</span>
        <span>Power</span><span class="power">–</span>
        <span>PCIe</span><span class="pcie">–</span>
      </div>
    </div>
  </section>

  <section class="cores" id="cores">
    <div class="h"><span id="coreLabel">CORES</span><span>avg <b id="coreAvg">–</b></span></div>
    <div class="cbars" id="cbars"></div>
  </section>

  <section class="sec" id="mem">
    <div class="ttl"><span class="t">MEMORY</span><img class="logo" alt="" hidden></div>
    <div class="meter" id="ram"><div class="row"><span class="k">RAM</span><span class="amt">–</span></div><div class="bar"><i></i><em>–</em></div></div>
    <div class="meter" id="vram"><div class="row"><span class="k">VRAM</span><span class="amt">–</span></div><div class="bar"><i></i><em>–</em></div></div>
  </section>

  <section class="fans" id="fans">
    <div class="ttl"><span class="t">FANS</span></div>
    <div class="fanrow" id="fanRow"></div>
  </section>
  <div class="board" id="board"></div>

  <section class="sec" id="storage">
    <div class="ttl"><span class="t">STORAGE</span><span id="storageLogos"></span></div>
    <div id="drives"></div>
    <div id="more"></div>
  </section>

  <section class="sec" id="net">
    <div class="ttl"><span class="t">NETWORK</span><img class="logo" alt="" hidden></div>
    <div class="rates"><span class="u" id="up">–</span><span class="d" id="down">–</span></div>
    <svg id="netSpark" class="spark"></svg>
  </section>

  <div class="sys" id="sys">
    <div id="topCpu"></div>
    <div id="topGpu"></div>
  </div>

  <div id="warn"></div>
</div>
<script src="panel.js"></script>
<script>
  if (new URLSearchParams(location.search).has('mock')) {
    const s = document.createElement('script'); s.src = 'mock.js'; document.body.appendChild(s);
  }
</script>
</body>
</html>
